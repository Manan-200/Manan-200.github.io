<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Get in touch">
    <title>Contact</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body>
    <div id="starfield" class="starfield"></div>
    <nav>
        <ul>
            <li><a href="../index.html">Manan</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><button id="theme-toggle">☀️</button></li>
        </ul>
    </nav>

    <main>
        <h1>Contact</h1>
        <div class="contact-content">
            <p class="subtitle">Got something to say? I'd love to hear from you.</p>

            <form id="contact-form">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" placeholder="Your name">
                    <span class="error" id="name-error"></span>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="xyz@email.com">
                    <span class="error" id="email-error"></span>
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" rows="5" placeholder="What's on your mind?"></textarea>
                    <span class="error" id="message-error"></span>
                </div>
                <button type="submit">Send Message</button>
            </form>

            <div id="confirmation" class="hidden">
                <h2>Message sent! 🎉</h2>
                <p>Thanks for reaching out, I'll get back to you soon.</p>
            </div>
        </div>
    </main>

    <script src="../js/starfield.js"></script>
    <script src="../js/contact.js"></script>
    <script src="../js/theme.js"></script>

</body>

</html>
